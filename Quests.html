<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quest Tracker</title>
    <style>
        /* General Styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
            color: #333;
        }

        h1 {
            text-align: center;
            color: #4a90e2;
            margin-top: 20px;
            font-size: 2.5rem;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        /* Tabs */
        .tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .tab-button {
            padding: 10px 20px;
            cursor: pointer;
            background-color: #e0e0e0;
            border: none;
            outline: none;
            margin: 0 5px;
            border-radius: 5px;
            font-size: 1rem;
            transition: background-color 0.3s ease;
        }

        .tab-button.active {
            background-color: #4a90e2;
            color: white;
        }

        .tab-button:hover {
            background-color: #357abd;
            color: white;
        }

        /* Quest Lists */
        .quest-list {
            margin: 20px 0;
        }

        .quest-item {
            padding: 15px;
            background-color: #f1f1f1;
            margin-bottom: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .quest-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .quest-item.completed {
            animation: whoosh 0.5s ease-out;
        }

        .quest-item.due-soon {
            background-color: #fff3cd;
        }

        .quest-item.due-urgent {
            background-color: #f8d7da;
        }

        .edit-btn, .delete-btn {
            background: none;
            border: none;
            cursor: pointer;
            margin-left: 10px;
            font-size: 1.2rem;
            color: #666;
            transition: color 0.3s ease;
        }

        .edit-btn:hover, .delete-btn:hover {
            color: #4a90e2;
        }

        /* Animations */
        @keyframes whoosh {
            0% { transform: translateX(0); opacity: 1; }
            100% { transform: translateX(100%); opacity: 0; }
        }

        /* Add Quest Button */
        .add-quest-btn {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .add-quest-btn:hover {
            background-color: #357abd;
        }
    </style>
</head>
<body>
    <h1>Quest Tracker</h1>
    <div class="container">
        <div class="tabs">
            <button class="tab-button active" onclick="showTab('daily')">Daily Quests</button>
            <button class="tab-button" onclick="showTab('job')">Job Quests</button>
        </div>

        <!-- Daily Quests Tab -->
        <div id="daily" class="quest-list">
            <div class="quest-item" onclick="completeQuest(this)">🌅 Wake up</div>
            <div class="quest-item" onclick="completeQuest(this)">🛏️ Get out of bed</div>
            <div class="quest-item" onclick="completeQuest(this)">🪥 Brush my teeth</div>
            <div class="quest-item" onclick="completeQuest(this)">🍳 Eat breakfast</div>
            <div class="quest-item" onclick="completeQuest(this)">🎒 Go to university</div>
            <div class="quest-item" onclick="completeQuest(this)">📚 Study for 2 hours</div>
            <div class="quest-item" onclick="completeQuest(this)">🏋️‍♂️ Exercise for 30 minutes</div>
            <div class="quest-item" onclick="completeQuest(this)">🛀 Take a shower</div>
            <div class="quest-item" onclick="completeQuest(this)">🍳 Eat Dinner</div>
            <div class="quest-item" onclick="completeQuest(this)">📚 Read up on the latest trends</div>
            <div class="quest-item" onclick="completeQuest(this)">😴 Go to bed</div>

        </div>

        <!-- Job Quests Tab -->
        <div id="job" class="quest-list" style="display:none;">
            <!-- Job Quests will be dynamically loaded here -->
            <button class="add-quest-btn" onclick="addQuest()">➕ Add New Quest</button>
        </div>

        <!-- Whoosh Sound -->
        <audio id="whoosh-sound" src="https://assets.mixkit.co/active_storage/sfx/2997/2997-preview.mp3"></audio>
    </div>

    <script>
        // Load saved job quests from localStorage
        let jobQuests = JSON.parse(localStorage.getItem('jobQuests')) || [];

        // Function to show the selected tab
        function showTab(tabName) {
            document.querySelectorAll('.quest-list').forEach(tab => {
                tab.style.display = 'none';
            });
            document.getElementById(tabName).style.display = 'block';

            document.querySelectorAll('.tab-button').forEach(button => {
                button.classList.remove('active');
            });
            document.querySelector(`button[onclick="showTab('${tabName}')"]`).classList.add('active');
        }
    // Function to edit a quest
        function editQuest(button) {
            const questItem = button.parentElement;
            const currentText = questItem.childNodes[0].nodeValue.trim();
            const dueDate = questItem.getAttribute('data-due-date');
            const newText = prompt("Edit your quest:", currentText);
            const newDueDate = prompt("Edit the due date (YYYY-MM-DD):", dueDate);

            if (newText && newDueDate) {
                questItem.childNodes[0].nodeValue = newText;
                questItem.setAttribute('data-due-date', newDueDate);
                saveJobQuests();
                updateQuestColors();
            }
        }

        // Function to delete a quest
        function deleteQuest(button) {
            const questItem = button.parentElement;
            if (confirm("Are you sure you want to delete this quest?")) {
                questItem.remove();
                saveJobQuests();
            }
        }

        // Function to complete a quest
        function completeQuest(quest) {
            if (confirm("Have you completed this quest?")) {
                quest.classList.add('completed');
                document.getElementById('whoosh-sound').play();
                setTimeout(() => {
                    quest.remove();
                }, 500);
            }
        }

        // Function to add a new quest
        function addQuest() {
            const newQuestText = prompt("Enter the new quest:");
            const dueDate = prompt("Enter the due date (YYYY-MM-DD):");
            if (newQuestText && dueDate) {
                const jobList = document.getElementById('job');
                const newQuest = document.createElement('div');
                newQuest.className = 'quest-item';
                newQuest.setAttribute('data-due-date', dueDate);
                newQuest.onclick = completeQuest();
                newQuest.innerHTML = `
                    ${newQuestText}
                    <button class="edit-btn" onclick="editQuest(this)">✏️</button>
                    <button class="delete-btn" onclick="deleteQuest(this)">🗑️</button>
                `;
                jobList.insertBefore(newQuest, jobList.lastElementChild);
                jobQuests.push({ text: newQuestText, dueDate: dueDate });
                saveJobQuests();
                updateQuestColors();
            }
        }

        // Function to save job quests to localStorage
        function saveJobQuests() {
            const jobList = document.getElementById('job');
            const quests = [];
            jobList.querySelectorAll('.quest-item').forEach(quest => {
                quests.push({
                    text: quest.childNodes[0].nodeValue.trim(),
                    dueDate: quest.getAttribute('data-due-date')
                });
            });
            localStorage.setItem('jobQuests', JSON.stringify(quests));
        }

        // Function to load job quests from localStorage
        function loadJobQuests() {
            const jobList = document.getElementById('job');
            jobQuests.forEach(quest => {
                const newQuest = document.createElement('div');
                newQuest.className = 'quest-item';
                newQuest.setAttribute('data-due-date', quest.dueDate);
                newQuest.innerHTML = `
                    ${quest.text}
                    <button class="edit-btn" onclick="editQuest(this)">✏️</button>
                    <button class="delete-btn" onclick="deleteQuest(this)">🗑️</button>
                `;
                jobList.insertBefore(newQuest, jobList.lastElementChild);
            });
            updateQuestColors();
        }

        // Load job quests on page load
        loadJobQuests();
    </script>
</body>
</html>
