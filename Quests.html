<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quest Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .tabs {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
        .tab-button {
            padding: 10px 20px;
            cursor: pointer;
            background-color: #ddd;
            border: none;
            outline: none;
            margin: 0 5px;
        }
        .tab-button.active {
            background-color: #bbb;
        }
        .quest-list {
            margin: 20px;
        }
        .quest-item {
            padding: 10px;
            background-color: #fff;
            margin-bottom: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }
        .quest-item.completed {
            animation: whoosh 0.5s ease-out;
        }
        .quest-item.due-soon {
            background-color: #fff3cd;
        }
        .quest-item.due-urgent {
            background-color: #f8d7da;
        }
        .edit-btn, .delete-btn {
            background: none;
            border: none;
            cursor: pointer;
            margin-left: 10px;
        }
        @keyframes whoosh {
            0% { transform: translateX(0); opacity: 1; }
            100% { transform: translateX(100%); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="tabs">
        <button class="tab-button active" onclick="showTab('daily')">Daily Quests</button>
        <button class="tab-button" onclick="showTab('job')">Job Quests</button>
    </div>

    <div id="daily" class="quest-list">
        <div class="quest-item" onclick="completeQuest(this)">Complete 10 push-ups</div>
        <div class="quest-item" onclick="completeQuest(this)">Read for 30 minutes</div>
        <div class="quest-item" onclick="completeQuest(this)">Drink 2 liters of water</div>
    </div>

    <div id="job" class="quest-list" style="display:none;">
        <!-- Job Quests will be dynamically loaded here -->
        <button onclick="addQuest()" style="margin-top: 10px;">Add New Quest</button>
    </div>

    <audio id="whoosh-sound" src="https://assets.mixkit.co/active_storage/sfx/2997/2997-preview.mp3"></audio>

    <script>
        // Load saved job quests from localStorage
        let jobQuests = JSON.parse(localStorage.getItem('jobQuests')) || [];

        // Function to show the selected tab
        function showTab(tabName) {
            document.querySelectorAll('.quest-list').forEach(tab => {
                tab.style.display = 'none';
            });
            document.getElementById(tabName).style.display = 'block';

            document.querySelectorAll('.tab-button').forEach(button => {
                button.classList.remove('active');
            });
            document.querySelector(`button[onclick="showTab('${tabName}')"]`).classList.add('active');
        }

        // Function to complete a quest
        function completeQuest(quest) {
            if (confirm("Have you completed this quest?")) {
                quest.classList.add('completed');
                document.getElementById('whoosh-sound').play();
                setTimeout(() => {
                    quest.remove();
                }, 500);
            }
        }

        // Function to edit a quest
        function editQuest(button) {
            const questItem = button.parentElement;
            const currentText = questItem.childNodes[0].nodeValue.trim();
            const dueDate = questItem.getAttribute('data-due-date');
            const newText = prompt("Edit your quest:", currentText);
            const newDueDate = prompt("Edit the due date (YYYY-MM-DD):", dueDate);

            if (newText && newDueDate) {
                questItem.childNodes[0].nodeValue = newText;
                questItem.setAttribute('data-due-date', newDueDate);
                saveJobQuests();
                updateQuestColors();
            }
        }

        // Function to delete a quest
        function deleteQuest(button) {
            const questItem = button.parentElement;
            if (confirm("Are you sure you want to delete this quest?")) {
                questItem.remove();
                saveJobQuests();
            }
        }

        // Function to add a new quest
        function addQuest() {
            const newQuestText = prompt("Enter the new quest:");
            const dueDate = prompt("Enter the due date (YYYY-MM-DD):");
            if (newQuestText && dueDate) {
                const jobList = document.getElementById('job');
                const newQuest = document.createElement('div');
                newQuest.className = 'quest-item';
                newQuest.setAttribute('data-due-date', dueDate);
                newQuest.innerHTML = `
                    ${newQuestText}
                    <button class="edit-btn" onclick="editQuest(this)">✏️</button>
                    <button class="delete-btn" onclick="deleteQuest(this)">🗑️</button>
                `;
                jobList.insertBefore(newQuest, jobList.lastElementChild);
                jobQuests.push({ text: newQuestText, dueDate: dueDate });
                saveJobQuests();
                updateQuestColors();
            }
        }

        // Function to save job quests to localStorage
        function saveJobQuests() {
            const jobList = document.getElementById('job');
            const quests = [];
            jobList.querySelectorAll('.quest-item').forEach(quest => {
                quests.push({
                    text: quest.childNodes[0].nodeValue.trim(),
                    dueDate: quest.getAttribute('data-due-date')
                });
            });
            localStorage.setItem('jobQuests', JSON.stringify(quests));
        }

        // Function to load job quests from localStorage
        function loadJobQuests() {
            const jobList = document.getElementById('job');
            jobQuests.forEach(quest => {
                const newQuest = document.createElement('div');
                newQuest.className = 'quest-item';
                newQuest.setAttribute('data-due-date', quest.dueDate);
                newQuest.innerHTML = `
                    ${quest.text}
                    <button class="edit-btn" onclick="editQuest(this)">✏️</button>
                    <button class="delete-btn" onclick="deleteQuest(this)">🗑️</button>
                `;
                jobList.insertBefore(newQuest, jobList.lastElementChild);
            });
            updateQuestColors();
        }

        // Function to update quest colors based on due dates
        function updateQuestColors() {
            const jobQuests = document.querySelectorAll('#job .quest-item');
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            jobQuests.forEach(quest => {
                const dueDate = new Date(quest.getAttribute('data-due-date'));
                const timeDiff = dueDate - today;
                const daysDiff = Math.ceil(timeDiff / (1000 * 60 * 60 * 24));

                quest.classList.remove('due-soon', 'due-urgent');
                if (daysDiff <= 3 && daysDiff > 1) {
                    quest.classList.add('due-soon');
                } else if (daysDiff <= 1) {
                    quest.classList.add('due-urgent');
                }
            });
        }

        // Function to reset daily quests at midnight
        function resetDailyQuests() {
            const now = new Date();
            const lastReset = localStorage.getItem('lastReset');
            const lastResetDate = lastReset ? new Date(lastReset) : null;

            if (!lastResetDate || now.toDateString() !== lastResetDate.toDateString()) {
                localStorage.setItem('lastReset', now.toISOString());
                const dailyQuests = [
                    'Complete 10 push-ups',
                    'Read for 30 minutes',
                    'Drink 2 liters of water'
                ];
                const dailyList = document.getElementById('daily');
                dailyList.innerHTML = dailyQuests.map(quest => `<div class="quest-item" onclick="completeQuest(this)">${quest}</div>`).join('');
            }
        }

        // Load job quests and reset daily quests on page load
        loadJobQuests();
        resetDailyQuests();

        // Check for reset every second
        setInterval(resetDailyQuests, 1000);
    </script>
</body>
</html>
